name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check Node examples
        run: |
          node --check nodejs/submit-job.js
          node --check nodejs/poll-status.js
          node --check nodejs/webhook-server.js

      - name: Check Python examples
        run: |
          python -m py_compile python/submit_job.py
          python -m py_compile python/poll_status.py
          python -m py_compile python/webhook_server.py
